<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sky Hopper</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0f1a; display: grid; place-items: center; }
    canvas { background: linear-gradient(#4ec0ff, #b8ecff); border-radius: 12px; max-width: 100%; max-height: 100vh; }
  </style>
</head>
<body>
  <canvas id="c" width="400" height="600"></canvas>
  <script>
    const c = document.getElementById("c"), ctx = c.getContext("2d");
    const GAP = 160, PIPE_W = 64, SPEED = 2.6;
    let bird, pipes, score, best = 0, state, frame;

    function reset() {
      bird = { x: 90, y: 280, vy: 0 };
      pipes = []; score = 0; frame = 0; state = "ready";
    }
    function flap() {
      if (state === "over") return reset();
      state = "play";
      bird.vy = -7.2;
    }
    addEventListener("keydown", e => { if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); flap(); } });
    c.addEventListener("pointerdown", flap);

    function update() {
      if (state !== "play") return;
      frame++;
      bird.vy += 0.38;
      bird.y += bird.vy;
      if (frame % 95 === 0) pipes.push({ x: c.width, top: 60 + Math.random() * (c.height - GAP - 160), passed: false });
      for (const p of pipes) {
        p.x -= SPEED;
        if (!p.passed && p.x + PIPE_W < bird.x) { p.passed = true; score++; }
        const hitX = bird.x + 14 > p.x && bird.x - 14 < p.x + PIPE_W;
        const hitY = bird.y - 14 < p.top || bird.y + 14 > p.top + GAP;
        if (hitX && hitY) state = "over";
      }
      pipes = pipes.filter(p => p.x > -PIPE_W);
      if (bird.y > c.height - 40 || bird.y < 0) state = "over";
      if (state === "over") best = Math.max(best, score);
    }

    function draw() {
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.fillStyle = "#3cb043";
      for (const p of pipes) {
        ctx.fillRect(p.x, 0, PIPE_W, p.top);
        ctx.fillRect(p.x, p.top + GAP, PIPE_W, c.height);
      }
      ctx.fillStyle = "#d9b26f"; ctx.fillRect(0, c.height - 40, c.width, 40);
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(Math.max(-0.5, Math.min(1, bird.vy / 10)));
      ctx.fillStyle = "#ffd23f"; ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(6, -5, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(7, -5, 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ff8c1a"; ctx.fillRect(12, 0, 9, 5);
      ctx.restore();
      ctx.fillStyle = "#fff"; ctx.strokeStyle = "#000"; ctx.lineWidth = 4;
      ctx.font = "bold 44px Arial"; ctx.textAlign = "center";
      ctx.strokeText(score, c.width / 2, 70); ctx.fillText(score, c.width / 2, 70);
      ctx.font = "bold 22px Arial";
      const msg = state === "ready" ? "Click / Space to hop" : state === "over" ? `Game over · Best ${best} · Click to retry` : "";
      if (msg) { ctx.strokeText(msg, c.width / 2, c.height / 2); ctx.fillText(msg, c.width / 2, c.height / 2); }
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    reset(); loop();
  </script>
</body>
</html>
